# ShortLink 站点配置
# - /         -> 前端静态(Vue dist)
# - /s/<code> -> 后端 302 跳转
# - /api/*    -> 后端 RESTful
# - /apidocs  -> Swagger UI
# - /health   -> 后端健康检查

server {
    listen 80;
    server_name _;

    # 真实 IP 透传(Nginx 反代场景)
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # 静态前端(由 nginx 直出)
    root /var/www/shortlink;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /favicon.ico {
        try_files $uri =404;
    }

    # 短码跳转(Nginx 转发,后端 302)
    location ~ ^/s/[^/]+$ {
        proxy_pass http://shortlink_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Swagger / 接口文档
    location ~ ^/(apidocs|apispec|flasgger|apispec_) {
        proxy_pass http://shortlink_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    # REST API
    location /api/ {
        proxy_pass http://shortlink_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # 健康检查
    location = /health {
        proxy_pass http://shortlink_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # SPA fallback(非 /api/,非 /s/,非 /apidocs 走前端)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
